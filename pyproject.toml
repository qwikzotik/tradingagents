[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingagents"
version = "0.2.0"
description = "TradingAgents: Multi-Agents LLM Financial Trading Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-core~=1.2",
    "backtrader~=1.9",
    "chainlit~=2.5",
    "langchain-anthropic~=1.3",
    "langchain-experimental~=0.3",
    "langchain-google-genai~=4.2",
    "langchain-openai~=1.1",
    "langgraph~=1.0",
    "pandas~=3.0",
    "parsel~=1.11",
    "pytz>=2025.2",
    "questionary~=2.1",
    "rank-bm25~=0.2",
    "redis~=6.2",
    "requests~=2.32",
    "rich~=14.0",
    "typer~=0.21",
    "setuptools>=68.1",
    "stockstats~=0.6",
    "tqdm~=4.67",
    "typing-extensions~=4.15",
    "yfinance~=1.2",
]

[project.scripts]
tradingagents = "cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["tradingagents*", "cli*"]
